name: Gerar Perfil

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "README.en.md"
      - "projects.json"
      - "content.json"
      - "scripts/**"
      - ".github/workflows/perfil.yml"

jobs:
  gerar:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Gerar README, cards e visuais
        env:
          GH_TOKEN: ${{ secrets.CARDS_TOKEN }}
        run: |
          npm run readme
          npm run readme:check
          npm run generate
          npm run visuals
          mkdir -p dist
          cp cards/*.svg dist/
      - name: Publicar branch output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin output:output || true
          git checkout --orphan perfil-output
          git rm -rf . >/dev/null 2>&1 || true
          cp -R dist/. .
          git add .
          git commit -m "chore: atualizar assets do perfil"
          git push --force origin HEAD:output
