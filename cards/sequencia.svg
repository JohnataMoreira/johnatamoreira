<svg width="840" height="200" viewBox="0 0 840 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gStreak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A3D6E"/>
      <stop offset="0.5" stop-color="#F27321"/>
      <stop offset="1" stop-color="#C45A10"/>
    </linearGradient>
    <radialGradient id="gFire" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F27321" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F27321" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1.5" y="1.5" width="837" height="197" rx="14"
        fill="#161B22" stroke="url(#gStreak)" stroke-width="2"/>

  <text x="40" y="42" font-family="'Segoe UI',system-ui,sans-serif" font-size="18"
        font-weight="800" fill="#FAFAF8">🔥 Sequência de contribuições</text>

  <!-- halo de fogo atrás da coluna central (streak atual) -->
  <circle cx="420" cy="88" r="70" fill="url(#gFire)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <!-- anel animado da streak atual -->
  <circle cx="420" cy="88" r="58" fill="none" stroke="#21262D" stroke-width="3"/>
  <circle cx="420" cy="88" r="58" fill="none" stroke="#F27321" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="365" stroke-dashoffset="365"
          transform="rotate(-90 420 88)">
    <animate attributeName="stroke-dashoffset" from="365" to="70" dur="1.2s" begin="0.3s" fill="freeze"/>
  </circle>

  <!-- divisores verticais -->
  <line x1="280" y1="60" x2="280" y2="150" stroke="#21262D" stroke-width="1"/>
  <line x1="560" y1="60" x2="560" y2="150" stroke="#21262D" stroke-width="1"/>

  
    <text x="140" y="96" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
          font-size="44" font-weight="800" fill="#FAFAF8" opacity="0">827
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0"
               dur="0.7s" begin="0.2s" fill="freeze"/>
    </text>
    <text x="140" y="122" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
          font-size="13" font-weight="600" fill="#FAFAF8" letter-spacing="0.5" opacity="0">CONTRIBUIÇÕES
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.35s" fill="freeze"/>
    </text>
    <text x="140" y="142" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
          font-size="10" fill="#8B949E" opacity="0">último ano
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.45s" fill="freeze"/>
    </text>
  
    <text x="420" y="96" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
          font-size="44" font-weight="800" fill="#F27321" opacity="0">15 dias
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0"
               dur="0.7s" begin="0.5s" fill="freeze"/>
    </text>
    <text x="420" y="122" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
          font-size="13" font-weight="600" fill="#FAFAF8" letter-spacing="0.5" opacity="0">SEQUÊNCIA ATUAL
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.65s" fill="freeze"/>
    </text>
    <text x="420" y="142" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
          font-size="10" fill="#8B949E" opacity="0">desde 28/7/2026
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.75s" fill="freeze"/>
    </text>
  
    <text x="700" y="96" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
          font-size="44" font-weight="800" fill="#FFD700" opacity="0">23 dias
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.8s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0"
               dur="0.7s" begin="0.8s" fill="freeze"/>
    </text>
    <text x="700" y="122" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
          font-size="13" font-weight="600" fill="#FAFAF8" letter-spacing="0.5" opacity="0">MAIOR SEQUÊNCIA
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.9500000000000001s" fill="freeze"/>
    </text>
    <text x="700" y="142" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
          font-size="10" fill="#8B949E" opacity="0">4/7/2026 — 26/7/2026
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.05s" fill="freeze"/>
    </text>

  <text x="420" y="178" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
        font-size="10" fill="#8B949E">Calculado a partir de todos os repositórios — inclusive os privados</text>
</svg>